name: Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            script: build:linux
            artifact-name: ratchet-companion-linux
            artifact-path: build/release-package/ratchet-companion-linux.zip
          - platform: windows
            os: windows-latest
            script: build:windows
            artifact-name: ratchet-companion-windows
            artifact-path: build/release-package/ratchet-companion-windows.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Restore .NET dependencies
        run: dotnet restore lib/RatchetCompanion.sln

      - name: Apply release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm --prefix ui version "$VERSION" --no-git-tag-version --allow-same-version
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build package
        run: npm run ${{ matrix.script }}

      - name: Create Linux release zip
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p build/release-package
          zip -j build/release-package/ratchet-companion-linux.zip build/release-linux/*.AppImage build/release-linux/pvar_overlay.json

      - name: Create Windows release zip
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release-package | Out-Null
          $app = Get-ChildItem build/release-win -Filter *.exe | Select-Object -First 1
          if (-not $app) {
            throw "No Windows executable found in build/release-win"
          }
          Compress-Archive -Path @($app.FullName, (Resolve-Path build/release-win/pvar_overlay.json).Path) -DestinationPath build/release-package/ratchet-companion-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ratchet-companion-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
